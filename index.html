  <body>
    <div id="root"></div>
    <style id="avesta-responsive-overrides">
      /* Responsive-only presentation layer. The compiled application and its
         engineering calculations above are intentionally left unchanged. */
      html {
        overflow-x: clip;
        scroll-padding-top: 4.5rem;
      }

      body {
        min-width: 320px;
        min-height: 100dvh;
        overflow-x: clip;
      }

      img,
      svg,
      canvas {
        max-width: 100%;
      }

      button,
      a,
      input,
      select,
      textarea {
        touch-action: manipulation;
      }

      .recharts-responsive-container,
      .recharts-wrapper,
      .recharts-surface {
        max-width: 100% !important;
      }

      .overflow-x-auto {
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-inline: contain;
        scrollbar-gutter: stable;
      }

      @media (pointer: coarse) {
        .btn,
        .btn-primary,
        .btn-secondary,
        .btn-dark,
        .btn-ghost,
        nav a,
        button[aria-label] {
          min-height: 44px;
        }

        button[aria-label],
        .btn-ghost {
          min-width: 44px;
        }

        input[type="checkbox"],
        input[type="radio"] {
          width: 22px;
          height: 22px;
        }
      }

      @media screen and (max-width: 767px),
        screen and (max-width: 960px) and (max-height: 520px) and (orientation: landscape) {
        body {
          font-size: 16px;
        }

        #root > div > header > div {
          height: 56px;
          padding-left: max(1rem, env(safe-area-inset-left));
          padding-right: max(1rem, env(safe-area-inset-right));
        }

        #root > div > header > nav[class~="lg:hidden"] {
          position: fixed;
          inset: 56px 0 auto;
          max-height: calc(100dvh - 56px);
          overflow-y: auto;
          padding: 0.75rem max(1rem, env(safe-area-inset-right))
            max(0.75rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
          background: #14171c;
          box-shadow: 0 18px 30px rgba(13, 15, 18, 0.28);
        }

        #root > div > header > nav[class~="lg:hidden"] a {
          min-height: 48px;
          font-size: 1rem;
        }

        main.flex-1 {
          padding: 1rem max(0.75rem, env(safe-area-inset-right))
            max(1.5rem, env(safe-area-inset-bottom)) max(0.75rem, env(safe-area-inset-left));
        }

        main,
        main * {
          min-width: 0;
        }

        footer.no-print {
          padding: 1rem max(1rem, env(safe-area-inset-right))
            max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
          line-height: 1.5;
        }

        h1,
        h2,
        h3,
        p,
        dd,
        td,
        .break-words {
          overflow-wrap: anywhere;
        }

        h1.text-2xl,
        h1.text-xl {
          font-size: clamp(1.35rem, 6vw, 1.75rem) !important;
          line-height: 1.2 !important;
        }

        .text-4xl {
          font-size: clamp(1.75rem, 8vw, 2.25rem) !important;
          line-height: 1.15 !important;
        }

        .space-y-8 > :not([hidden]) ~ :not([hidden]) {
          margin-top: 1.5rem;
        }

        .space-y-6 > :not([hidden]) ~ :not([hidden]) {
          margin-top: 1.25rem;
        }

        .card > header[class*="px-5"],
        .card > div.p-5,
        [role="dialog"] > div.p-5 {
          padding-left: 1rem !important;
          padding-right: 1rem !important;
        }

        .card > div.p-5,
        [role="dialog"] > div.p-5 {
          padding-top: 1rem !important;
          padding-bottom: 1rem !important;
        }

        section.p-6,
        .p-8 {
          padding: 1.25rem !important;
        }

        .grid.grid-cols-3,
        .grid.grid-cols-4 {
          grid-template-columns: minmax(0, 1fr) !important;
        }

        .min-w-\[260px\] {
          width: 100% !important;
          min-width: 0 !important;
        }

        input.input,
        select.input,
        textarea.input,
        input.table-input,
        select.table-input {
          min-height: 44px;
          font-size: 16px !important;
        }

        textarea.input {
          min-height: 7rem;
        }

        button,
        a.btn,
        a.btn-primary,
        a.btn-secondary,
        a.btn-dark {
          min-height: 44px;
        }

        button[aria-label],
        .btn-ghost {
          min-width: 44px;
        }

        .chip {
          min-height: 36px;
          padding: 0.35rem 0.65rem;
          white-space: normal;
          text-align: center;
        }

        [role="switch"] {
          min-width: 44px;
          min-height: 28px;
        }

        input[type="checkbox"],
        input[type="radio"] {
          width: 22px !important;
          height: 22px !important;
          flex: 0 0 auto;
        }

        ol.card {
          scroll-snap-type: x proximity;
          padding: 0.75rem;
        }

        ol.card > li {
          scroll-snap-align: start;
        }

        ol.card button {
          min-height: 44px;
          padding-inline: 0.75rem;
        }

        main .inline-flex.rounded.border {
          max-width: 100%;
          overflow-x: auto;
        }

        [role="dialog"] {
          max-height: calc(100dvh - max(0.5rem, env(safe-area-inset-top))) !important;
          border-radius: 0.875rem 0.875rem 0 0;
        }

        [role="dialog"] > header {
          position: sticky;
          top: 0;
          z-index: 1;
          padding-left: 1rem !important;
          padding-right: 0.5rem !important;
          background: #fff;
        }

        [role="dialog"] > div.overflow-y-auto {
          padding-bottom: max(1rem, env(safe-area-inset-bottom)) !important;
          overscroll-behavior: contain;
        }

        /* Tables become readable, editable cards on phones. Header labels are
           copied to data-label attributes by the small enhancement script below. */
        div.overflow-x-auto:has(> table[data-mobile-table="cards"]),
        .card.overflow-x-auto:has(> table[data-mobile-table="cards"]) {
          overflow: visible !important;
        }

        table[data-mobile-table="cards"] {
          display: block !important;
          width: 100% !important;
          min-width: 0 !important;
          border-collapse: separate;
        }

        table[data-mobile-table="cards"] thead {
          position: absolute !important;
          width: 1px !important;
          height: 1px !important;
          padding: 0 !important;
          margin: -1px !important;
          overflow: hidden !important;
          clip: rect(0, 0, 0, 0) !important;
          white-space: nowrap !important;
        }

        table[data-mobile-table="cards"] tbody {
          display: grid !important;
          gap: 0.75rem;
          padding: 0.75rem;
        }

        table[data-mobile-table="cards"] tbody tr {
          display: block !important;
          overflow: hidden;
          border: 1px solid #d0d5dd !important;
          border-radius: 0.5rem;
          background: #fff;
          box-shadow: 0 1px 2px rgba(16, 20, 26, 0.05);
        }

        table[data-mobile-table="cards"] tbody tr:hover {
          background: #fff;
        }

        table[data-mobile-table="cards"] tbody td {
          display: grid !important;
          grid-template-columns: minmax(7rem, 38%) minmax(0, 1fr);
          align-items: center;
          gap: 0.25rem 0.75rem;
          width: 100% !important;
          min-width: 0 !important;
          padding: 0.6rem 0.75rem !important;
          border: 0 !important;
          border-bottom: 1px solid #e8ebef !important;
          text-align: left !important;
          white-space: normal !important;
        }

        table[data-mobile-table="cards"] tbody td:last-child {
          display: flex !important;
          flex-wrap: wrap;
          align-items: center;
          justify-content: flex-end;
          gap: 0.35rem;
          border-bottom: 0 !important;
        }

        table[data-mobile-table="cards"] tbody td::before {
          content: attr(data-label);
          align-self: center;
          color: #5a6270;
          font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
          font-size: 0.6875rem;
          font-weight: 600;
          letter-spacing: 0.05em;
          line-height: 1.25;
          text-transform: uppercase;
        }

        table[data-mobile-table="cards"] tbody td > * {
          grid-column: 2;
          max-width: 100%;
        }

        table[data-mobile-table="cards"] tbody td:last-child::before {
          margin-right: auto;
        }

        table[data-mobile-table="cards"] .w-16,
        table[data-mobile-table="cards"] .w-24,
        table[data-mobile-table="cards"] .w-32,
        table[data-mobile-table="cards"] .w-48,
        table[data-mobile-table="cards"] .min-w-\[180px\] {
          width: 100% !important;
          min-width: 0 !important;
        }

        table[data-mobile-table="cards"] .table-input {
          width: 100% !important;
          min-width: 0 !important;
          text-align: left !important;
        }

        div.overflow-x-auto:has(> table[data-mobile-table="schedule"])::before {
          content: "Swipe horizontally to edit all 24 hours";
          position: sticky;
          left: 0;
          z-index: 1;
          display: block;
          width: max-content;
          padding: 0.5rem 0.75rem;
          color: #5a6270;
          background: rgba(244, 245, 247, 0.96);
          font-size: 0.75rem;
          font-weight: 500;
        }

        table[data-mobile-table="schedule"] button {
          width: 38px !important;
          height: 38px !important;
          min-width: 38px !important;
          min-height: 38px !important;
        }

        .recharts-responsive-container {
          width: 100% !important;
          height: clamp(12rem, 52vw, 15rem) !important;
          min-width: 0 !important;
          min-height: 12rem !important;
        }

        .recharts-legend-wrapper {
          max-width: 100%;
          overflow: hidden;
          font-size: 0.6875rem !important;
        }

        svg[role="img"] text {
          font-size: max(10px, 0.7rem);
        }
      }

      @media screen and (max-width: 420px) {
        main.flex-1 {
          padding-left: max(0.625rem, env(safe-area-inset-left));
          padding-right: max(0.625rem, env(safe-area-inset-right));
        }

        .flex.flex-wrap.items-end.justify-between > .btn-primary,
        .flex.flex-wrap.items-end.justify-between > a.btn-primary {
          width: 100%;
        }

        table[data-mobile-table="cards"] tbody {
          padding: 0.625rem;
        }

        table[data-mobile-table="cards"] tbody td {
          grid-template-columns: minmax(6.25rem, 36%) minmax(0, 1fr);
          padding: 0.55rem 0.625rem !important;
        }

        .flex.items-center.gap-3,
        .flex.items-center.gap-2 {
          flex-wrap: wrap;
        }
      }

      @media screen and (max-width: 340px) {
        .grid.grid-cols-2:not(dl) {
          grid-template-columns: minmax(0, 1fr) !important;
        }
      }

      @media screen and (max-width: 960px) and (max-height: 520px) and (orientation: landscape) {
        main.flex-1 {
          padding-top: 0.75rem;
        }

        [role="dialog"] {
          max-height: 100dvh !important;
        }

        .recharts-responsive-container {
          height: 11.5rem !important;
          min-height: 11.5rem !important;
        }
      }
    </style>
    <script id="avesta-responsive-enhancements">
      (() => {
        const enhanceTables = () => {
          document.querySelectorAll("table").forEach((table) => {
            const headers = Array.from(table.querySelectorAll("thead th"));
            if (!headers.length) return;

            const isSchedule = headers.length > 15;
            table.dataset.mobileTable = isSchedule ? "schedule" : "cards";
            if (isSchedule) return;

            const labels = headers.map((header, index) => {
              const label = (header.textContent || "").replace(/\s+/g, " ").trim();
              return label || (index === headers.length - 1 ? "Actions" : "Value");
            });

            table.querySelectorAll("tbody tr").forEach((row) => {
              Array.from(row.children).forEach((cell, index) => {
                const label = labels[index] || `Column ${index + 1}`;
                if (cell.dataset.label !== label) cell.dataset.label = label;
              });
            });
          });
        };

        let frame = 0;
        const scheduleEnhancement = () => {
          if (frame) return;
          frame = requestAnimationFrame(() => {
            frame = 0;
            enhanceTables();
          });
        };

        const observer = new MutationObserver(scheduleEnhancement);
        observer.observe(document.getElementById("root"), { childList: true, subtree: true });
        window.addEventListener("DOMContentLoaded", scheduleEnhancement, { once: true });
        window.addEventListener("orientationchange", scheduleEnhancement);
        scheduleEnhancement();
      })();
    </script>
